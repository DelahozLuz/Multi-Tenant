<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
    <h3 class="text-center mb-4 fw-bold">Iniciar Sesión</h3>

    @if (!step1Complete()) {
      <form [formGroup]="formStep1" (ngSubmit)="onStep1Submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input formControlName="email" type="email" class="form-control form-control-lg" placeholder="nombre@ejemplo.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input formControlName="password" type="password" class="form-control form-control-lg" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="!formStep1.valid || loading()">
          @if (loading()) { <span class="spinner-border spinner-border-sm"></span> }
          @else { Continuar }
        </button>
      </form>
    } @else {
      <form [formGroup]="formStep2" (ngSubmit)="onStep2Submit()">
        <div class="alert alert-light border text-center mb-3">
          Hola, <strong>{{ email() }}</strong>
        </div>

        <div class="mb-3">
          <label class="form-label">Selecciona Workspace</label>
          <select formControlName="workspaceId" class="form-select form-select-lg">
            @for (ws of workspaces(); track ws.workspaceId) {
              <option [value]="ws.workspaceId">{{ ws.nombreWorkspace }} ({{ ws.rol }})</option>
            }
          </select>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-link w-50" (click)="goBack()">Volver</button>
          <button type="submit" class="btn btn-primary w-50" [disabled]="!formStep2.valid || loading()">
            Ingresar
          </button>
        </div>
      </form>
    }
  </div>
</div>
